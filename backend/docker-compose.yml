version: '3.8'

services:
  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URI=mongodb://nirvik_user:nirvik_pass@mongodb:27017/nirvik?authSource=nirvik
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=nirvik_neo4j_pass
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - FABRIC_MODE=mock
      - APP_SECRET_KEY=dev_secret_key_change_in_production_32bytes
      - JWT_SECRET_KEY=dev_jwt_secret_key_change_in_production_64bytes
    depends_on:
      - mongodb
      - neo4j
      - redis
      - minio

  mongodb:
    image: mongo:7.0
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=nirvik_user
      - MONGO_INITDB_ROOT_PASSWORD=nirvik_pass
      - MONGO_INITDB_DATABASE=nirvik
    volumes:
      - mongo_data:/data/db

  neo4j:
    image: neo4j:5.26-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/nirvik_neo4j_pass
      - NEO4J_PLUGINS=["apoc", "graph-data-science"]
    volumes:
      - neo4j_data:/data

  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-14Z
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

volumes:
  mongo_data:
  neo4j_data:
  minio_data:
